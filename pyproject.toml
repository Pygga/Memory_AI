[project]
name = "memory-ai"
version = "1.0.0"
description = "Telegram Memory Book Bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4.0,<4.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.23,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "greenlet>=3.0.3",
    "redis>=5.0.1,<6.0.0",
    "weasyprint>=60.2,<61.0",
    "jinja2>=3.1.2,<4.0.0",
    "pydyf<0.10.0",
    "faster-whisper>=1.0.1,<2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "loguru>=0.7.2",
    "pillow>=10.1.0,<11.0.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    "markdown>=3.5.0",
    "arq>=0.25.0"
]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.5"
]

[tool.uv]
package = false
