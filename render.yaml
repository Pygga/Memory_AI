# Memory Book Bot - Render Configuration

services:
  - type: web
    name: memory-book-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot/main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: memory-book-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: memory-book-redis
          property: connectionString
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: memory-book-db
    databaseName: memory_book
    user: memory_user
    plan: free

services:
  - type: redis
    name: memory-book-redis
    plan: free
