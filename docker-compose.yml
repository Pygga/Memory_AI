version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: memory_book_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: memory_book
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d memory_book"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: memory_book_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: memory_book_bot
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/memory_book
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
    volumes:
      - ./logs:/app/logs
      - ./static:/app/static
    restart: unless-stopped

  worker:
    build: .
    container_name: memory_book_worker
    command: arq bot.services.queue.worker.WorkerSettings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/memory_book
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
    volumes:
      - ./logs:/app/logs
      - ./static:/app/static
    restart: unless-stopped

volumes:
  postgres_data:
